name: Deploy Oracle backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oracle-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend to Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ORACLE_SSH_PRIVATE_KEY"
          test -n "$ORACLE_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy main on Oracle
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORACLE_HOST"
          test -n "$ORACLE_USER"
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$ORACLE_USER@$ORACLE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/claude-clan

          # Never overwrite an unexpected checkout state on the server.
          test -z "$(git status --porcelain)"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main

          pnpm install --frozen-lockfile
          NODE_OPTIONS=--max-old-space-size=512 pnpm --filter "@sudo-city/server..." build

          sudo -n systemctl restart sudo-city.service
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:4100/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 10 http://127.0.0.1:4100/health
          sudo -n systemctl is-active --quiet sudo-city.service
          test -z "$(git status --porcelain)"
          printf '\nDeployed commit: '
          git rev-parse --short HEAD
          REMOTE

      - name: Verify public API
        shell: bash
        run: curl --fail --show-error --silent --max-time 20 https://claudecity-api.fype.dev/health
